# ============================================================================
# ai-ops-agent (K8s DaemonSet)
# ============================================================================
#
# 架构升级说明（重要）
# --------------------
# 旧版（已废弃）：netshoot + sleep infinity，平台靠 ``kubectl exec`` 进容器。
# 新版：agent 跑一个 HTTP server，平台直接 HTTP POST 调它。无需 ``kubectl exec``，
#       省去 kubeconfig 跨平台依赖。
#
# 协议见 docs/host-agent.md。
#
# 部署步骤
# --------
# 1. 平台管理员生成 token：
#       TOKEN=$(openssl rand -hex 32)
#       kubectl -n ai-ops create secret generic ai-ops-agent-token \
#           --from-literal=token=$TOKEN
#       # 把 $TOKEN 同步到平台 admin UI 的 host_agent connection 上
#
# 2. 改 ``image:`` 字段指向内网 harbor 上的镜像，然后 apply：
#       kubectl apply -f ai-ops-agent-k8s.yaml
#
# 3. 卸载：
#       kubectl delete -f ai-ops-agent-k8s.yaml
#
# 4. 验证：
#       NODE_IP=$(kubectl get node -o jsonpath='{.items[0].status.addresses[?(@.type=="InternalIP")].address}')
#       curl http://$NODE_IP:9100/livez            # → "ok"
#       curl -H "Authorization: Bearer $TOKEN" \
#            http://$NODE_IP:9100/v1/health | jq .
#
# 网络可达性
# ----------
# Agent 跑在 ``hostNetwork: true`` 模式下，监听节点的 9100 端口。平台 backend
# 容器需要能直连节点 IP:9100。Pod 默认网络通常能直连 node IP（除非有 NetworkPolicy
# 阻断）；如有限制，可在 admin UI 的 host_agent connection 里改 ``agent_port``
# 或自定义路由。
# ============================================================================
---
apiVersion: v1
kind: Namespace
metadata:
  name: ai-ops

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-ops-agent
  namespace: ai-ops

---
# Token Secret —— 部署前由管理员手工创建，不在本 YAML 里硬编码
# 命令：kubectl -n ai-ops create secret generic ai-ops-agent-token --from-literal=token=$(openssl rand -hex 32)

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ai-ops-agent
  namespace: ai-ops
  labels:
    app: ai-ops-agent
spec:
  selector:
    matchLabels:
      app: ai-ops-agent
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: ai-ops-agent
    spec:
      serviceAccountName: ai-ops-agent

      # Agent 不需要跟 K8s API server 对话——关掉 SA token 自动挂载，避免 kubelet
      # 在 /run/secrets/kubernetes.io/serviceaccount/ 下创目录（跟我们的 secret 挂载冲突）。
      automountServiceAccountToken: false

      # 看到宿主机所有进程 / 网络栈 / IPC（nsenter 必须）
      hostPID: true
      hostNetwork: true
      hostIPC: true
      dnsPolicy: ClusterFirstWithHostNet

      # 覆盖到 master / control-plane 节点
      tolerations:
        - operator: Exists

      priorityClassName: system-node-critical

      containers:
        - name: agent
          # 内网 harbor 镜像；私有化部署到不同 harbor 时改这里即可
          image: mobile.chinasws.com:9990/ops/ai-ops-agent:1.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: agent-http
              containerPort: 9100
              hostPort: 9100
              protocol: TCP
          env:
            - name: AGENT_PORT
              value: "9100"
            - name: AGENT_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # crictl 在 containerd 下用的 socket
            - name: CONTAINER_RUNTIME_ENDPOINT
              value: unix:///run/containerd/containerd.sock
            - name: IMAGE_SERVICE_ENDPOINT
              value: unix:///run/containerd/containerd.sock
            # 可选：限制只接 backend pod 网段；不填 = 任意源（仍要 token）
            # - name: AGENT_ALLOWED_CIDR
            #   value: "10.20.0.0/16"
          securityContext:
            privileged: true
            capabilities:
              add:
                - SYS_ADMIN
                - SYS_PTRACE
                - NET_ADMIN
                - NET_RAW
          resources:
            requests:
              cpu: "20m"
              memory: "32Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          # K8s 自己的 health probe 直接打 /livez（无鉴权）
          livenessProbe:
            httpGet:
              path: /livez
              port: 9100
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /livez
              port: 9100
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2

          volumeMounts:
            # Token 通过 Secret 挂到固定路径
            - { name: token,       mountPath: /run/secrets, readOnly: true }
            # 宿主机文件系统只读挂到 /host
            - { name: host-root,   mountPath: /host,    readOnly: true,
                mountPropagation: HostToContainer }
            - { name: host-proc,   mountPath: /host/proc, readOnly: true }
            - { name: host-sys,    mountPath: /host/sys,  readOnly: true }
            # 容器排障：进 pod 自己 netns 时需要其中之一
            - { name: docker-sock, mountPath: /var/run/docker.sock }
            - { name: containerd-sock, mountPath: /run/containerd, readOnly: false }

      volumes:
        - name: token
          secret:
            secretName: ai-ops-agent-token
            items:
              - key: token
                path: token             # → /run/secrets/token，跟 agent 默认路径对齐
        - name: host-root
          hostPath: { path: / }
        - name: host-proc
          hostPath: { path: /proc }
        - name: host-sys
          hostPath: { path: /sys }
        - name: docker-sock
          hostPath: { path: /var/run/docker.sock, type: "" }
        - name: containerd-sock
          hostPath: { path: /run/containerd, type: "" }

      terminationGracePeriodSeconds: 5

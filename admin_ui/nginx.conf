server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA history fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 反代到 backend 容器
    #
    # ⚠️ DNS 不缓存:nginx 默认在 worker 启动时一次性解析 upstream domain,然后
    # 永远缓存。如果 backend 容器 docker compose recreate 后 IP 变了,nginx 仍
    # 指旧 IP → 502 Bad Gateway 直到 admin-ui 容器也 restart。
    #
    # 解法:用 Docker embedded DNS (127.0.0.11) + 把 upstream 放进变量 ——
    # 变量形式的 proxy_pass 让 nginx 每次请求都 re-resolve,DNS TTL 控制粒度。
    location /admin/api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream "http://backend:5000";
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 静态资源缓存
    location ~* \.(js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # nginx 自我健康
    location = /health {
        access_log off;
        return 200 "ok\n";
    }
}

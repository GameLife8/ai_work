# ai-ops-agent 命令白名单
# ========================
#
# 这里列出的命令才能被 ``/v1/exec`` / ``/v1/exec/stream`` 调用。任何不在 ``read_only``
# 列表里的命令一律 403。
#
# 改动后 **必须重启 agent 容器** 才能生效（agent 启动时一次性加载，不做 inotify 监听）。
#
# 设计原则（大道至简后）
# --------
# - 下面列了一批取证型只读命令（ss / ip / iptables-save / dmesg / cat / dig / getent /
#   crictl…），**但真正决定"能跑什么"的是文件末尾的 ``sh`` / ``bash``**：``host_run_command``
#   始终以 ``sh -c <命令>`` 调 agent，所以模型给的任意命令（含写操作 / curl / nc / 嵌套
#   nsenter）都经 ``sh`` 放行。
# - **真正的安全边界是平台侧的「每次执行弹确认」（当前会话用户审批）+ 全量审计**，不是这份
#   白名单。与其在 agent 维护一份永远追不全的黑/白名单，不如让审批人对每条命令负责。
# - 除 ``sh`` / ``bash`` 外的条目如今基本是历史遗留：早期那批直接传 ss/ip/dmesg（不经 sh）的
#   read-only host skill 已删；保留这些条目无害，模型把它们写在 ``sh -c`` 串里执行。

read_only:
  # 网络 socket / 路由 / 接口
  - ss
  - ip
  - ipvsadm
  - iptables-save
  - ip6tables-save
  - nft
  - ethtool
  - bridge
  - arp

  # 包抓取（流式才有意义；要靠 timeout_sec 限制）
  - tcpdump

  # 内核 / 系统事件
  - dmesg
  - sysctl
  - lsof
  - lscpu
  - lsblk
  - lsmod
  - ps
  - top                   # 用 ``-b -n 1`` 非交互模式调用
  - free
  - uptime
  - vmstat
  - iostat
  - mpstat

  # 文件读取（path 由 skill 收口；agent 不做 path 二次校验，依赖 host 只读挂载）
  - cat
  - head
  - tail
  - stat
  - file
  - find                  # 仅供枚举；写操作不在白名单里也调不动
  - df
  - du
  - mount

  # 容器排障（K8s 节点）。
  # 注意:容器→宿主机 PID 的解析(docker inspect / crictl)由 **agent 内部编排**完成
  # (用挂进来的 docker.sock / runtime socket),**不**经过这里的业务命令白名单——所以
  # 不需要把 docker 放进白名单(放了在 docker_proxy 模式还会被硬拦)。
  - crictl
  - ctr

  # DNS / 域名解析（不含 curl/wget，防 SSRF）
  - dig
  - nslookup
  - host
  - getent

  # shell —— 给 host_run_command (admin 审批 + 平台侧 needs_confirmation) 用。
  # 设计取舍：这俩本来会让"agent 白名单"形同虚设，但 host_run_command 的真正
  # 安全边界**是平台侧的 admin 审批**，不是 agent 白名单。允许 sh/bash 让
  # admin 审批通过的 ``df -h`` / ``du -sh /data`` / 复杂 pipe 都能执行。
  # 其他 read-only skill（host_socket_overview 等）从不调 sh —— 它们直接传
  # ss / ip / iptables-save 等可执行，跟 sh 这条无关。
  - sh
  - bash

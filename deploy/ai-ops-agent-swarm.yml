# =====================================================================
# ai-ops-agent (Docker Swarm global service)
# =====================================================================
#
# 架构升级说明（重要）
# --------------------
# 旧版（已废弃）：用 ``nicolaka/netshoot`` 跑 ``sleep infinity``，平台靠
#   ``docker exec`` 进容器跑 ``nsenter``——这要求 worker 节点也暴露 daemon TCP，
#   实际上把 daemon socket 安全模型放到了风口。
#
# 新版：agent 自己跑一个 **HTTP server (:9100)**，平台 backend 直接 HTTP
#   调它。manager 节点只暴露 2375（用于查 ``docker node inspect`` 拿节点
#   IP），worker 节点**不需要**任何 docker daemon TCP。
#
# 协议 + 安全模型详见 docs/host-agent.md。
#
# =====================================================================
# 部署
# =====================================================================
#
# 1. 编辑 ``.env``（同一目录）填这台 Swarm manager 的几个变量：
#
#     AGENT_IMAGE=mobile.chinasws.com:9990/ops/ai-ops-agent:1.0  # 内网 harbor 镜像
#     BACKEND_CIDR=10.20.0.0/16                                   # 平台 backend 网段
#                                                                  # （加一道源 IP 限制，可选）
#
# 2. 给整个集群生成一个 token，写成 docker secret：
#
#     openssl rand -hex 32 | docker secret create ai-ops-agent-token -
#     # 同一个 token 副本也要在平台 admin UI 创建 host_agent connection 时填进去
#
# 3. 部署：
#
#     docker stack deploy -c ai-ops-agent-swarm.yml ai-ops
#
# 4. 卸载：
#
#     docker stack rm ai-ops
#     docker secret rm ai-ops-agent-token
#
# 5. 验证：
#
#     # 在 manager 节点
#     curl http://<任一节点IP>:9100/livez                          # → "ok"
#     curl -H "Authorization: Bearer <你的token>" \
#          http://<节点IP>:9100/v1/health | jq .
# =====================================================================
# compose 版本：3.6 是 Docker 18.06+ 都支持的稳妥版本；如你的 swarm 是
# Docker 19.03+，可以把 ``version: "3.8"`` + ``update_config.order: start-first``
# 加回来获得更丝滑的滚动更新。
version: "3.6"

services:
  ai-ops-agent:
    image: ${AGENT_IMAGE:-mobile.chinasws.com:9990/ops/ai-ops-agent:1.0}

    deploy:
      mode: global                       # 每个节点都跑一份
      restart_policy:
        condition: any
        delay: 5s
      update_config:
        parallelism: 1                   # 滚动更新时一次一台节点
        delay: 5s
        failure_action: rollback
      resources:
        limits:    { cpus: "0.5", memory: 256M }
        reservations: { cpus: "0.02", memory: 32M }

    # 进宿主机 namespace 的必要权限
    pid: "host"
    network_mode: "host"                 # 绑节点 :9100，不走 overlay
    privileged: true
    cap_add:
      - SYS_ADMIN
      - SYS_PTRACE
      - NET_ADMIN
      - NET_RAW

    environment:
      AGENT_PORT: "9100"
      # 让 agent 写日志时知道自己在哪台节点
      AGENT_NODE_NAME: "{{.Node.Hostname}}"
      # 可选：限制只接来自平台 backend 网段的请求；空 = 不限源 IP
      AGENT_ALLOWED_CIDR: "${BACKEND_CIDR:-}"

    secrets:
      - source: ai-ops-agent-token
        target: token                    # → /run/secrets/token，agent 启动时读

    volumes:
      # 宿主机文件系统只读挂到 /host（``cat /host/etc/sysctl.conf`` 等会用）
      - type: bind
        source: /
        target: /host
        read_only: true
        bind: { propagation: rshared }
      # 给 K8s（如混合部署）的 crictl 用；纯 Swarm 集群可删
      # - /run/containerd/containerd.sock:/run/containerd/containerd.sock

    # 健康检查由镜像内置 HEALTHCHECK（GET /livez）负责，这里不重复

secrets:
  ai-ops-agent-token:
    external: true                       # 必须先 docker secret create

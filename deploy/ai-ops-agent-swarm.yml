# ============================================================================
# ai-ops-agent (Docker Swarm global service)
#
# 部署：
#   docker stack deploy -c ai-ops-agent-swarm.yml ai-ops
#
# 卸载：
#   docker stack rm ai-ops
#
# 重要限制
# --------
# Swarm 的 ``docker exec`` 只能对 **本地 daemon 上的容器** 生效。要让平台真正
# 跨节点 exec 进每台 agent，常见做法二选一：
#   1) 每个节点 daemon 暴露 tcp://NODE:2375（**强烈推荐配 mTLS**），
#      平台对每个节点单独注册一份 host_agent connection（kind=swarm,
#      docker_host=tcp://NODE:2375）。
#   2) 用 SSH context 桥接：``docker context create --docker host=ssh://...``，
#      不过这样又依赖 SSH，本平台目标是去 SSH 化，所以推荐方案 1。
# ============================================================================
version: "3.8"

services:
  ai-ops-agent:
    image: nicolaka/netshoot:latest
    deploy:
      mode: global
      restart_policy:
        condition: any
      resources:
        limits: { cpus: "0.5", memory: 256M }
        reservations: { cpus: "0.02", memory: 32M }
      placement:
        constraints: []
    pid: "host"
    network_mode: "host"
    privileged: true
    cap_add:
      - SYS_ADMIN
      - SYS_PTRACE
      - NET_ADMIN
      - NET_RAW
    command: ["sleep", "infinity"]
    volumes:
      # 宿主机文件系统只读
      - type: bind
        source: /
        target: /host
        read_only: true
        bind: { propagation: rshared }
      # docker 容器排障
      - /var/run/docker.sock:/var/run/docker.sock
